groups:
  - name: homelab-availability
    rules:
      - alert: ProxmoxExporterDown
        expr: up{job="proxmox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Proxmox exporter is unreachable"
          description: "Prometheus has been unable to scrape the Proxmox exporter for more than 2 minutes."

      - alert: ProxmoxGuestDown
        #expr: pve_up{id=~"lxc/.*|qemu/.*"} == 0
        expr: |
          pve_up{id=~"lxc/(100|101|102|103|104|105|107|108|109)"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Proxmox guest {{ $labels.id }} is down"
          description: "Proxmox reports guest {{ $labels.id }} as down for more than 3 minutes."

  - name: homelab-resource-usage
    rules:
      - alert: ProxmoxNodeHighCPU
        expr: pve_cpu_usage_ratio{id="node/VFIEVOX3"} > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Proxmox node CPU usage is high"
          description: "Node VFIEVOX3 CPU usage has exceeded 90% for 10 minutes."

      - alert: ProxmoxGuestHighCPU
        expr: pve_cpu_usage_ratio{id=~"lxc/.*|qemu/.*"} > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.id }}"
          description: "Guest {{ $labels.id }} CPU usage has exceeded 90% for 15 minutes."


      - alert: HomeAssistantDown
        expr: probe_success{job="home-assistant"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Home Assistant is unreachable"
          description: "The Home Assistant web interface at 192.168.1.2:8123 has failed its HTTP probe for more than 2 minutes."
